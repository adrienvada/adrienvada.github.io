<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page introuvable — Adrien Vada</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon_io/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon_io/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <style>
        :root {
            --bg: #FAF9F5;
            --text: #1A1A1F;
            --muted: #575761;
            --gold: #967e5b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', system-ui, sans-serif;
            text-align: center;
        }

        .card {
            max-width: 520px;
            background: rgba(255, 255, 255, .85);
            border: 1px solid rgba(0, 0, 0, .05);
            border-radius: 14px;
            padding: 40px 32px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, .04);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        h1 span {
            font-family: 'Cinzel', serif;
            color: var(--gold);
        }

        .code {
            font-size: .7rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 18px;
        }

        p {
            color: var(--muted);
            font-size: .92rem;
            line-height: 1.6;
            margin: 0 0 26px;
        }

        a.btn {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 8px;
            background: var(--gold);
            color: #fff;
            text-decoration: none;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition: background .3s;
        }

        a.btn:hover {
            background: #bfa98a;
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(0, 0, 0, .07);
            margin: 26px 0 16px;
        }

        .links a {
            color: var(--muted);
            font-size: .75rem;
            text-decoration: none;
            margin: 0 8px;
        }

        .links a:hover {
            color: var(--gold);
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="code">Erreur 404</div>
        <h1>Adrien <span>VADA</span></h1>
        <p>Cette page n'existe pas ou a été déplacée.<br>Retrouvez le CV, les dates de représentation et les démos sur
            la page d'accueil.</p>
        <a class="btn" href="/">Retour à l'accueil</a>
        <hr>
        <div class="links">
            <a href="/#page_cv">CV</a>
            <a href="/#page_dates">Dates</a>
            <a href="/#demos_camera">Démos caméra</a>
            <a href="/#demos_voix">Voix</a>
        </div>
    </main>
</body>

</html>
