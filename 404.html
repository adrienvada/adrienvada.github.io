<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0907">
    <title>Page introuvable — Adrien Vada</title>

    <!-- Mesure d'audience — Umami, sans cookie ni identifiant persistant.
         POURQUOI MESURER UNE PAGE D'ERREUR. C'est la seule du site dont le
         contenu est une mauvaise nouvelle, et donc la seule qu'il faut
         espérer voir vide. Sans balise, une adresse morte citée dans un
         dossier de presse, un ancien lien de billetterie ou une faute de
         frappe dans un QR code enverraient des gens dans le mur sans que
         rien ne le signale — l'adresse demandée est justement ce que la
         mesure enregistre, et c'est ce qui permet d'aller la réparer.
         `data-domains` : mêmes raisons qu'ailleurs, les aperçus de branche
         Cloudflare ne doivent rien peser. Voir README-build.md, § Mesure
         d'audience. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="23c34c7a-c28c-4b5b-b237-a154139b62da"
        data-domains="adrienvada.fr"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon_io/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon_io/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <style>
        /* Aligné sur le thème sombre du site (voir index.html) */
        :root {
            --bg: #0a0907;
            --text: #f2ece0;
            --muted: #b0a798;
            --gold: #bfa98a;
            --card: rgba(255, 255, 255, 0.035);
            --line: rgba(255, 255, 255, 0.07);
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* La couleur de repli doit précéder l'image : la forme courte
               `background` réinitialise sinon le dégradé. */
            background: var(--bg);
            background-image: radial-gradient(ellipse 90% 60% at 50% 0%, #17140f 0%, #0b0906 55%, #060504 100%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Montserrat', system-ui, sans-serif;
            text-align: center;
        }

        .card {
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 40px 32px;
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, .5);
            backdrop-filter: blur(8px);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        h1 span {
            font-family: 'Cinzel', serif;
            color: var(--gold);
        }

        .code {
            font-size: .7rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 18px;
        }

        p {
            color: var(--muted);
            font-size: .92rem;
            line-height: 1.6;
            margin: 0 0 26px;
        }

        a.btn {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 8px;
            background: var(--gold);
            color: #0c0a08;
            text-decoration: none;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition: background .3s;
        }

        a.btn:hover {
            background: #e0d2ba;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--line);
            margin: 26px 0 16px;
        }

        .links a {
            color: var(--muted);
            font-size: .75rem;
            text-decoration: none;
            margin: 0 8px;
        }

        .links a:hover {
            color: var(--gold);
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="code">Erreur 404</div>
        <h1>Adrien <span>VADA</span></h1>
        <p>Cette page n’existe pas ou a été déplacée.<br>Retrouvez le CV, les dates de représentation et les démos sur
            la page d’accueil.</p>
        <a class="btn" href="/">Retour à l’accueil</a>
        <hr>
        <div class="links">
            <a href="/#page_cv">CV</a>
            <a href="/#page_dates">Dates</a>
            <a href="/#demos_camera">Démos caméra</a>
            <a href="/#demos_voix">Voix</a>
        </div>
    </main>
</body>

</html>
