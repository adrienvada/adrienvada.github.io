# ============================================================
#  PUBLICATION DU SITE
# ============================================================
#  Le site est statique : il n'y a rien à construire, seulement à
#  déposer. Ce workflow remplace le bâtisseur historique de GitHub
#  Pages, qui échouait.
#
#  POURQUOI. Le bâtisseur historique reclone le dépôt ENTIER à chaque
#  publication. Or ce dépôt pèse 441 Mo d'historique pour un site de
#  67 Mo — les originaux des photos de spectacle y ont vécu avant d'en
#  sortir, et un objet git ne s'oublie jamais. La dernière publication
#  réussie a pris 9 min 58, contre une limite de 10 minutes ; toutes
#  celles d'après ont échoué. Le site est resté figé pendant une heure
#  sans que rien n'apparaisse dans le dépôt : le code partait bien, il
#  n'était simplement plus publié.
#
#  actions/checkout ne prend QUE le dernier commit (profondeur 1) : le
#  poids de l'historique cesse d'entrer en ligne de compte. La
#  publication passe de dix minutes à quelques secondes.
#
#  Et surtout : ce workflow a des JOURNAUX. Le bâtisseur historique ne
#  disait que « Page build failed », sans un mot de plus.
#
#  ⚠ L'HISTORIQUE A DEPUIS ÉTÉ DÉGRAISSÉ, et donc réécrit : toutes les
#  empreintes de commit ont changé. Le chiffre de 441 Mo ci-dessus vaut
#  pour l'avant. Ce que cela implique pour les copies de travail est
#  expliqué dans README-build.md, section « L'historique a été réécrit ».
# ============================================================
name: Publier le site

on:
  push:
    branches: [main]
  # Permet aussi de republier à la main depuis l'onglet Actions,
  # sans avoir à inventer un commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, et on ne coupe pas celle qui est en cours :
# une interruption en plein dépôt laisserait le site à moitié servi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dernier commit seulement
        uses: actions/checkout@v4

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      # ────────────────────────────────────────────────────────────
      #  LES OUTILS, AUX VERSIONS DU DÉPÔT
      # ────────────────────────────────────────────────────────────
      #  Playwright et les minifieurs viennent de build/package.json et de
      #  son package-lock.json : les versions exactes, les mêmes que sur la
      #  machine où l'on vérifie. « La dernière » changeait sous nos pieds —
      #  une nouvelle version de Playwright ou de son Chromium pouvait
      #  déplacer une coupure de page du CV sans qu'une ligne du dépôt ait
      #  bougé. On les monte à la main, en regardant le résultat.
      #
      #  INSTALLÉS HORS DU DOSSIER PUBLIÉ. Le dossier à empaqueter est la
      #  racine du dépôt telle quelle : un node_modules installé dans
      #  build/ y ferait un passager clandestin de plusieurs dizaines de
      #  mégaoctets. Les outils vont donc dans le dossier temporaire de
      #  l'action ; NODE_PATH les rend visibles aux scripts, PATH à la
      #  commande `playwright`.
      #
      #  `continue-on-error` : si l'installation échoue, les deux étapes
      #  suivantes échouent à leur tour, proprement — elles aussi le
      #  tolèrent — et le site part tel qu'il est dans le dépôt.
      - name: Installer les outils (versions figées)
        continue-on-error: true
        run: |
          OUTILS="$RUNNER_TEMP/outils"
          mkdir -p "$OUTILS"
          cp build/package.json build/package-lock.json "$OUTILS/"
          npm ci --prefix "$OUTILS" --no-audit --no-fund
          echo "NODE_PATH=$OUTILS/node_modules" >> "$GITHUB_ENV"
          echo "$OUTILS/node_modules/.bin" >> "$GITHUB_PATH"

      # ────────────────────────────────────────────────────────────
      #  LE CV EN PDF, REFAIT À CHAQUE PUBLICATION
      # ────────────────────────────────────────────────────────────
      #  Le fichier est versionné : il part de toute façon avec le
      #  dépôt, et c'est lui que servent les aperçus Cloudflare. On le
      #  refait ici pour qu'un oubli de `npm --prefix build run pdf` ne
      #  puisse pas laisser un CV périmé en ligne.
      #
      #  `continue-on-error` n'est pas une négligence : c'est le
      #  contrat. Si Playwright, Chromium ou le rendu échouent un jour,
      #  la publication continue et sert la version versionnée — un CV
      #  d'une modification en retard vaut infiniment mieux qu'un site
      #  qui ne se publie plus. Le journal, lui, gardera la trace du
      #  ratage.
      #
      #  `playwright install` est celui de l'étape précédente, et non
      #  celui de npx : npx irait chercher la dernière version de l'outil,
      #  qui installerait un Chromium qui n'est pas celui de la
      #  bibliothèque.
      - name: Refaire le CV en PDF
        continue-on-error: true
        run: |
          playwright install --with-deps chromium
          node build/generer-cv-pdf.js

      # ────────────────────────────────────────────────────────────
      #  LA COPIE PUBLIÉE PERD SES COMMENTAIRES — PAS LE DÉPÔT
      # ────────────────────────────────────────────────────────────
      #  Les sources sont écrites pour être relues, et les commentaires
      #  pèsent plus de la moitié d'index.html. Ils sont retirés de ce
      #  qui part en ligne, et de rien d'autre : cette copie-ci est jetée
      #  après le dépôt. Voir build/alleger-publication.js — chaque
      #  fichier y est vérifié, puis les pages sont ouvertes dans le
      #  Chromium de l'étape précédente ; au moindre doute, tout revient
      #  à l'original.
      #
      #  `continue-on-error`, pour la même raison que le PDF : si l'outil
      #  manque ou plante, on publie les fichiers tels qu'ils sont dans
      #  le dépôt. Plus lourds, mais justes.
      - name: Alléger les fichiers servis
        continue-on-error: true
        run: node build/alleger-publication.js

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          # Tout le dépôt tel quel : il EST le site. .git et .github
          # sont écartés d'office par l'action.
          path: .

      - name: Déposer
        id: deploiement
        uses: actions/deploy-pages@v4
        with:
          # TRENTE MINUTES AU LIEU DE DIX. L'action abandonne par défaut au
          # bout de dix minutes d'attente — et c'est l'action qui abandonne,
          # pas GitHub Pages qui échoue : le journal montre un déploiement
          # passé en `deployment_in_progress`, donc bel et bien pris en
          # charge, puis annulé par le minuteur.
          #
          # Le site pesait alors 67 Mo, dont 30 pour le château-mystère et 33
          # pour les photos et les démos voix. C'était lourd à distribuer, et
          # les publications réussies de la journée l'ont montré en
          # s'allongeant sans cesse : 45 s au petit matin, 245 s, 274 s, puis
          # 598 s pour la dernière — juste avant que le plafond de dix minutes
          # ne coupe tout. Le minuteur a été atteint par la croissance du
          # site, pas par une panne.
          #
          # Trente minutes ne masquent donc rien : elles rendent à la
          # publication le temps qu'elle demande. Le château-mystère est parti
          # depuis (il vivait ensuite dans son propre dépôt, et n'est plus
          # servi) : le site pèse aujourd'hui une cinquantaine de Mo, photos
          # et démos voix pour l'essentiel — versions allégées des photos
          # comprises. C'est ce poids qu'il faut viser pour raccourcir la
          # publication pour de bon.
          timeout: 1800000
